[project]
name = "qneuro-forge"
version = "0.1.0"
description = "Quantum-kernel vs classical ML benchmarks on neurodevelopmental datasets, signed with post-quantum cryptography."
requires-python = ">=3.11"
dependencies = [
    "pennylane>=0.35.0",
    "scikit-learn>=1.3",
    "xgboost>=2.0",
    "scipy>=1.11",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.0",
    "typer>=0.9.0",
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "kyber-py>=0.1",
    "dilithium-py>=0.1",
    "cryptography>=41.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.6",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
qneuro = "qneuro.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qneuro*"]
