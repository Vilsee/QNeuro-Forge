<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 412" width="880" role="img" aria-labelledby="t d"><title id="t">The two kernels in this study as circuits</title><desc id="d">Angle embedding uses one rotation per qubit and no entanglement; the ZZ feature map adds Hadamards, phases and pairwise entangling blocks.</desc><rect width="880" height="412" fill="#E8E7E2"/><text x="24.0" y="30.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1C1B18" text-anchor="start" font-weight="600">Two different kernels: what was submitted, and what the platform default is</text><rect x="24.0" y="50.0" width="400.0" height="300.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="40.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1E6B55" text-anchor="start" font-weight="600">Angle embedding  (the submitted E5 kernel)</text><line x1="70.0" y1="118.0" x2="396.0" y2="118.0" stroke="#1C1B18" stroke-width="1"/><text x="60.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q0</text><rect x="150.0" y="105.0" width="70.0" height="26.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="185.0" y="123.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">RX(x1)</text><line x1="70.0" y1="158.0" x2="396.0" y2="158.0" stroke="#1C1B18" stroke-width="1"/><text x="60.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q1</text><rect x="150.0" y="145.0" width="70.0" height="26.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="185.0" y="163.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">RX(x2)</text><line x1="70.0" y1="198.0" x2="396.0" y2="198.0" stroke="#1C1B18" stroke-width="1"/><text x="60.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q2</text><rect x="150.0" y="185.0" width="70.0" height="26.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="185.0" y="203.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">RX(x3)</text><line x1="70.0" y1="238.0" x2="396.0" y2="238.0" stroke="#1C1B18" stroke-width="1"/><text x="60.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q3</text><rect x="150.0" y="225.0" width="70.0" height="26.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="185.0" y="243.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">RX(x4)</text><text x="40.0" y="292.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">Each qubit is rotated on its own. Nothing connects them,</text><text x="40.0" y="309.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">so the state is a product state: no entanglement.</text><text x="40.0" y="332.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" fill="#1C1B18" text-anchor="start" font-weight="500">K(a,b) = ∏ᵢ cos²((aᵢ − bᵢ)/2)</text><rect x="456.0" y="50.0" width="400.0" height="300.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="472.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#86600F" text-anchor="start" font-weight="600">ZZ feature map  (Bloq default; local E3, E4, E6)</text><line x1="502.0" y1="118.0" x2="840.0" y2="118.0" stroke="#1C1B18" stroke-width="1"/><text x="492.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q0</text><rect x="512.0" y="106.0" width="26.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="525.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">H</text><rect x="546.0" y="106.0" width="62.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="577.0" y="122.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="middle" font-weight="400">P(2x1)</text><line x1="502.0" y1="158.0" x2="840.0" y2="158.0" stroke="#1C1B18" stroke-width="1"/><text x="492.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q1</text><rect x="512.0" y="146.0" width="26.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="525.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">H</text><rect x="546.0" y="146.0" width="62.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="577.0" y="162.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="middle" font-weight="400">P(2x2)</text><line x1="502.0" y1="198.0" x2="840.0" y2="198.0" stroke="#1C1B18" stroke-width="1"/><text x="492.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q2</text><rect x="512.0" y="186.0" width="26.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="525.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">H</text><rect x="546.0" y="186.0" width="62.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="577.0" y="202.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="middle" font-weight="400">P(2x3)</text><line x1="502.0" y1="238.0" x2="840.0" y2="238.0" stroke="#1C1B18" stroke-width="1"/><text x="492.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">q3</text><rect x="512.0" y="226.0" width="26.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="525.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="middle" font-weight="400">H</text><rect x="546.0" y="226.0" width="62.0" height="24.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="577.0" y="242.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="middle" font-weight="400">P(2x4)</text><line x1="635.0" y1="118.0" x2="635.0" y2="158.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="635.0" cy="118.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="635.0" cy="158.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><line x1="669.0" y1="118.0" x2="669.0" y2="198.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="669.0" cy="118.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="669.0" cy="198.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><line x1="703.0" y1="118.0" x2="703.0" y2="238.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="703.0" cy="118.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="703.0" cy="238.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><line x1="737.0" y1="158.0" x2="737.0" y2="198.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="737.0" cy="158.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="737.0" cy="198.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><line x1="771.0" y1="158.0" x2="771.0" y2="238.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="771.0" cy="158.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="771.0" cy="238.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><line x1="805.0" y1="198.0" x2="805.0" y2="238.0" stroke="#1E6B55" stroke-width="2.4"/><circle cx="805.0" cy="198.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><circle cx="805.0" cy="238.0" r="4" fill="#1E6B55" stroke="none" stroke-width="1"/><text x="626.0" y="94.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#1E6B55" text-anchor="start" font-weight="400">one entangling block per pair</text><text x="472.0" y="292.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">Hadamards, single-qubit phases, then a phase on every pair</text><text x="472.0" y="309.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">of qubits (6 pairs for 4 qubits). The qubits become entangled.</text><text x="472.0" y="332.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="500">pair phase: P(2(π − xᵢ)(π − xⱼ))</text><text x="24.0" y="376.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="400">Same four numbers, same SVM, different kernels, different answers.</text><text x="24.0" y="394.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="400">On the submitted holdout the angle kernel scores 0.746 and the ZZ kernel 0.672.</text></svg>
