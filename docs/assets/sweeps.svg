<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" role="img" aria-labelledby="t d"><title id="t">Input range sweeps</title><desc id="d">Cross-validated MCC against input range for E3 and E4, with and without time.</desc><rect width="880" height="330" fill="#E8E7E2"/><text x="24.0" y="30.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1C1B18" text-anchor="start" font-weight="600">Does a wider input range break the ZZ kernel?</text><text x="24.0" y="64.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1B18" text-anchor="start" font-weight="600">E3, depth 1: cross-validated MCC</text><line x1="60.0" y1="242.9" x2="348.0" y2="242.9" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="54.0" y="246.9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">0.0</text><line x1="60.0" y1="188.6" x2="348.0" y2="188.6" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="54.0" y="192.6" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">0.2</text><line x1="60.0" y1="134.3" x2="348.0" y2="134.3" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="54.0" y="138.3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">0.4</text><line x1="60.0" y1="80.0" x2="348.0" y2="80.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="54.0" y="84.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="end" font-weight="400">0.6</text><line x1="60.0" y1="242.9" x2="348.0" y2="242.9" stroke="#1C1B18" stroke-width="1"/><text x="60.0" y="290.0" font-family="ui-monospace, SFMono-Regular, Menlo