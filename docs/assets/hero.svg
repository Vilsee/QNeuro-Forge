<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" role="img" aria-labelledby="t d"><title id="t">QNeuro Forge at a glance</title><desc id="d">From 299 patients to a signed ledger, with the four headline results.</desc><rect width="880" height="330" fill="#E8E7E2"/><text x="24.0" y="38.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#1C1B18" text-anchor="start" font-weight="600">Does the quantum kernel hold up?</text><text x="24.0" y="60.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57544C" text-anchor="start" font-weight="400">Team Morphos heart-failure QSVM, every number recomputed and signed</text><rect x="24.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="34.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">299 patients</text><text x="34.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">UCI heart-failure</text><text x="34.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">records</text><line x1="155.0" y1="121.0" x2="163.0" y2="121.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="163.0,121.0 156.7,124.0 156.7,118.0" fill="#1C1B18"/><rect x="164.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="174.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">4 numbers each</text><text x="174.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">age, ejection frac.,</text><text x="174.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">creatinine, time</text><line x1="295.0" y1="121.0" x2="303.0" y2="121.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="303.0,121.0 296.7,124.0 296.7,118.0" fill="#1C1B18"/><rect x="304.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="314.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">4 qubits</text><text x="314.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">one simulated state</text><text x="314.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">per patient</text><line x1="435.0" y1="121.0" x2="443.0" y2="121.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="443.0,121.0 436.7,124.0 436.7,118.0" fill="#1C1B18"/><rect x="444.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="454.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">kernel</text><text x="454.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">overlap of two</text><text x="454.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">patients' states</text><line x1="575.0" y1="121.0" x2="583.0" y2="121.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="583.0,121.0 576.7,124.0 576.7,118.0" fill="#1C1B18"/><rect x="584.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="594.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">SVM</text><text x="594.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">draws the line</text><text x="594.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">between outcomes</text><line x1="715.0" y1="121.0" x2="723.0" y2="121.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="723.0,121.0 716.7,124.0 716.7,118.0" fill="#1C1B18"/><rect x="724.0" y="84.0" width="130.0" height="74.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="734.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1E6B55" text-anchor="start" font-weight="600">signed ledger</text><text x="734.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">hashes, ML-DSA-65,</text><text x="734.0" y="143.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400">audit chain</text><line x1="24.0" y1="184.0" x2="856.0" y2="184.0" stroke="#1C1B18" stroke-width="1"/><text x="24.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#1C1B18" text-anchor="start" font-weight="500">0.746</text><text x="24.0" y="256.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">submitted QSVM, holdout MCC</text><text x="24.0" y="272.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">(60 patients)</text><text x="234.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#1C1B18" text-anchor="start" font-weight="500">0.600 / 0.599</text><text x="234.0" y="256.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">best quantum vs best classical,</text><text x="234.0" y="272.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">MCC over 15 paired splits</text><line x1="220.0" y1="200.0" x2="220.0" y2="290.0" stroke="#CAC7BC" stroke-width="1"/><text x="444.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#1C1B18" text-anchor="start" font-weight="500">16 of 20</text><text x="444.0" y="256.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">claims from the report</text><text x="444.0" y="272.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">hold after re-checking</text><line x1="430.0" y1="200.0" x2="430.0" y2="290.0" stroke="#CAC7BC" stroke-width="1"/><text x="654.0" y="232.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="23" fill="#1C1B18" text-anchor="start" font-weight="500">18 + 27</text><text x="654.0" y="256.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">files hashed + signed</text><text x="654.0" y="272.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">audit entries</text><line x1="640.0" y1="200.0" x2="640.0" y2="290.0" stroke="#CAC7BC" stroke-width="1"/><text x="24.0" y="316.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400" font-style="italic">No hardware ran any circuit: every quantum state here is simulated on an ordinary computer.</text></svg>
