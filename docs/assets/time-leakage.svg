<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" role="img" aria-labelledby="t d"><title id="t">Follow-up time carries the outcome</title><desc id="d">Single-feature AUROC, and MCC with time versus serum sodium for four models.</desc><rect width="880" height="330" fill="#E8E7E2"/><text x="24.0" y="30.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1C1B18" text-anchor="start" font-weight="600">Follow-up time carries the outcome</text><text x="24.0" y="50.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">Left: each feature alone (AUROC, 239 training patients). Right: CV MCC with time (filled) and serum sodium (open).</text><text x="24.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="600">single-feature AUROC (0.5 = no signal)</text><line x1="180.0" y1="84.0" x2="180.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="180.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.5</text><line x1="233.8" y1="84.0" x2="233.8" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="233.8" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.6</text><line x1="287.5" y1="84.0" x2="287.5" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="287.5" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.7</text><line x1="341.2" y1="84.0" x2="341.2" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="3