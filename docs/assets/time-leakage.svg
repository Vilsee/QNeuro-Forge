pace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">0.688</text><text x="24.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">age</text><line x1="180.0" y1="224.0" x2="256.3" y2="224.0" stroke="#57544C" stroke-width="2.2"/><circle cx="256.3" cy="224.0" r="5.5" fill="#57544C" stroke="none" stroke-width="1"/><text x="266.3" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">0.642</text><text x="470.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="600">cross-validated MCC</text><line x1="590.0" y1="84.0" x2="590.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="590.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.2</text><line x1="632.0" y1="84.0" x2="632.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="632.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.3</text><line x1="674.0" y1="84.0" x2="674.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="674.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.4</text><line x1="716.0" y1="84.0" x2="716.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="716.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.5</text><line x1="758.0" y1="84.0" x2="758.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="758.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.6</text><line x1="800.0" y1="84.0" x2="800.0" y2="244.0" stroke="#CAC7BC" stroke-width="1" stroke-dasharray="3 3"/><text x="800.0" y="260.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#57544C" text-anchor="middle" font-weight="400">0.7</text><text x="470.0" y="108.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1E6B55" text-anchor="start" font-weight="600">QSVM, ZZ kernel</text><line x1="672.4" y1="104.0" x2="758.0" y2="104.0" stroke="#1E6B55" stroke-width="2.2"/><circle cx="672.4" cy="104.0" r="5.5" fill="#E8E7E2" stroke="#1E6B55" stroke-width="2"/><circle cx="758.0" cy="104.0" r="5.5" fill="#1E6B55" stroke="none" stroke-width="1"/><text x="856.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="end" font-weight="400">−0.204</text><text x="470.0" y="148.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">SVM-RBF</text><line x1="664.6" y1="144.0" x2="746.6" y2="144.0" stroke="#1C1B18" stroke-width="2.2"/><circle cx="664.6" cy="144.0" r="5.5" fill="#E8E7E2" stroke="#1C1B18" stroke-width="2"/><circle cx="746.6" cy="144.0" r="5.5" fill="#1C1B18" stroke="none" stroke-width="1"/><text x="856.0" y="148.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="end" font-weight="400">−0.195</text><text x="470.0" y="188.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">Logistic regression</text><line x1="647.1" y1="184.0" x2="743.1" y2="184.0" stroke="#1C1B18" stroke-width="2.2"/><circle cx="647.1" cy="184.0" r="5.5" fill="#E8E7E2" stroke="#1C1B18" stroke-width="2"/><circle cx="743.1" cy="184.0" r="5.5" fill="#1C1B18" stroke="none" stroke-width="1"/><text x="856.0" y="188.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="end" font-weight="400">−0.229</text><text x="470.0" y="228.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">Random forest</text><line x1="680.9" y1="224.0" x2="750.0" y2="224.0" stroke="#1C1B18" stroke-width="2.2"/><circle cx="680.9" cy="224.0" r="5.5" fill="#E8E7E2" stroke="#1C1B18" stroke-width="2"/><circle cx="750.0" cy="224.0" r="5.5" fill="#1C1B18" stroke="none" stroke-width="1"/><text x="856.0" y="228.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="end" font-weight="400">−0.164</text><line x1="24.0" y1="276.0" x2="856.0" y2="276.0" stroke="#CAC7BC" stroke-width="1"/><text x="24.0" y="300.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#1C1B18" text-anchor="start" font-weight="600">time alone: AUROC 0.812, the strongest single feature. Removing it costs every model 0.164 to 0.229 MCC.</text><text x="24.0" y="318.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">A model that needs follow-up time cannot predict ahead, so the with-time scores are optimistic for real use.</text></svg>
