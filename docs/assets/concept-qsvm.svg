<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" role="img" aria-labelledby="t d"><title id="t">How a quantum-kernel SVM works</title><desc id="d">Two patients become two quantum states; their overlap is the kernel; the kernel matrix feeds a normal SVM.</desc><rect width="880" height="330" fill="#E8E7E2"/><text x="24.0" y="30.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#1C1B18" text-anchor="start" font-weight="600">How a quantum-kernel SVM decides</text><rect x="24.0" y="56.0" width="170.0" height="150.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="36.0" y="78.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="600">two patients</text><text x="36.0" y="100.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400"></text><text x="128.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">a</text><text x="176.0" y="100.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">b</text><text x="36.0" y="120.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">age</text><text x="128.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.59</text><text x="176.0" y="120.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.27</text><text x="36.0" y="140.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">ejection</text><text x="128.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.30</text><text x="176.0" y="140.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.55</text><text x="36.0" y="160.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">creatinine</text><text x="128.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.07</text><text x="176.0" y="160.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.03</text><text x="36.0" y="180.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">time</text><text x="128.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.12</text><text x="176.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="end" font-weight="400">0.80</text><text x="30.0" y="222.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#57544C" text-anchor="start" font-weight="400" font-style="italic">illustrative values, scaled to 0 to 1</text><line x1="198.0" y1="130.0" x2="236.0" y2="130.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="236.0,130.0 229.7,133.0 229.7,127.0" fill="#1C1B18"/><rect x="240.0" y="56.0" width="200.0" height="150.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="252.0" y="78.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="600">feature map (4 qubits)</text><line x1="254.0" y1="104.0" x2="428.0" y2="104.0" stroke="#1C1B18" stroke-width="1"/><rect x="270.0" y="95.0" width="38.0" height="18.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="289.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1B18" text-anchor="middle" font-weight="400">x1</text><text x="250.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#57544C" text-anchor="end" font-weight="400">q0</text><line x1="254.0" y1="128.0" x2="428.0" y2="128.0" stroke="#1C1B18" stroke-width="1"/><rect x="270.0" y="119.0" width="38.0" height="18.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="289.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1B18" text-anchor="middle" font-weight="400">x2</text><text x="250.0" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#57544C" text-anchor="end" font-weight="400">q1</text><line x1="254.0" y1="152.0" x2="428.0" y2="152.0" stroke="#1C1B18" stroke-width="1"/><rect x="270.0" y="143.0" width="38.0" height="18.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="289.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1B18" text-anchor="middle" font-weight="400">x3</text><text x="250.0" y="156.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#57544C" text-anchor="end" font-weight="400">q2</text><line x1="254.0" y1="176.0" x2="428.0" y2="176.0" stroke="#1C1B18" stroke-width="1"/><rect x="270.0" y="167.0" width="38.0" height="18.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="289.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#1C1B18" text-anchor="middle" font-weight="400">x4</text><text x="250.0" y="180.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" fill="#57544C" text-anchor="end" font-weight="400">q3</text><rect x="334.0" y="94.0" width="78.0" height="88.0" rx="3" fill="#E8E7E2" stroke="#1E6B55" stroke-width="1.5"/><text x="373.0" y="142.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" fill="#1E6B55" text-anchor="middle" font-weight="400">entangle?</text><text x="373.0" y="156.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1E6B55" text-anchor="middle" font-weight="400">(ZZ yes,</text><text x="373.0" y="169.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="10.5" fill="#1E6B55" text-anchor="middle" font-weight="400">angle no)</text><line x1="444.0" y1="130.0" x2="482.0" y2="130.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="482.0,130.0 475.7,133.0 475.7,127.0" fill="#1C1B18"/><rect x="486.0" y="56.0" width="190.0" height="150.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="498.0" y="78.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="600">one state per patient</text><text x="498.0" y="108.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1C1B18" text-anchor="start" font-weight="400">|φ(a)⟩   |φ(b)⟩</text><text x="498.0" y="136.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#1C1B18" text-anchor="start" font-weight="600">kernel = overlap</text><text x="498.0" y="158.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1E6B55" text-anchor="start" font-weight="500">K(a,b) = |⟨φ(a)|φ(b)⟩|²</text><text x="498.0" y="182.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">1 = identical, 0 = unrelated</text><line x1="680.0" y1="130.0" x2="718.0" y2="130.0" stroke="#1C1B18" stroke-width="1.4"/><polygon points="718.0,130.0 711.7,133.0 711.7,127.0" fill="#1C1B18"/><rect x="722.0" y="56.0" width="134.0" height="150.0" rx="2" fill="#E8E7E2" stroke="#1C1B18" stroke-width="1"/><text x="734.0" y="78.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="600">ordinary SVM</text><rect x="738.0" y="94.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="754.0" y="94.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="770.0" y="94.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="786.0" y="94.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="802.0" y="94.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="738.0" y="106.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="754.0" y="106.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="770.0" y="106.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="786.0" y="106.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="802.0" y="106.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="738.0" y="118.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="754.0" y="118.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="770.0" y="118.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="786.0" y="118.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="802.0" y="118.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="738.0" y="130.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="754.0" y="130.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="770.0" y="130.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="786.0" y="130.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="802.0" y="130.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="738.0" y="142.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="754.0" y="142.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="770.0" y="142.0" width="14.0" height="10.0" rx="0" fill="#D3E0D6" stroke="none" stroke-width="0"/><rect x="786.0" y="142.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><rect x="802.0" y="142.0" width="14.0" height="10.0" rx="0" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="734.0" y="168.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#1C1B18" text-anchor="start" font-weight="400">239 × 239 matrix</text><text x="734.0" y="184.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">of overlaps feeds</text><text x="734.0" y="198.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#57544C" text-anchor="start" font-weight="400">the usual SVM</text><line x1="24.0" y1="244.0" x2="856.0" y2="244.0" stroke="#CAC7BC" stroke-width="1"/><text x="24.0" y="268.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="400">The quantum part is only the similarity measure. Training and prediction are classical.</text><text x="24.0" y="286.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="400">Here the qubits are simulated: one state per patient, then a matrix product gives every overlap.</text><text x="24.0" y="304.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#57544C" text-anchor="start" font-weight="400">On real hardware each pair of patients would need its own circuit run many times (see the cost estimate below).</text></svg>
