<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" role="img" aria-labelledby="t d"><title id="t">How 299 patients were split</title><desc id="d">239 training and 60 holdout patients, stratified by outcome.</desc><rect width="880" height="290" fill="#E8E7E2"/><text x="24.0" y="30.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#1C1B18" text-anchor="start" font-weight="600">The data: 299 patients, split once, scaled on the training rows only</text><rect x="24.0" y="52.0" width="665.0" height="56.0" rx="2" fill="#D3E0D6" stroke="#1C1B18" stroke-width="1"/><rect x="689.0" y="52.0" width="167.0" height="56.0" rx="2" fill="#DDDBD3" stroke="#1C1B18" stroke-width="1"/><text x="36.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1B18" text-anchor="start" font-weight="600">239 training patients</text><text x="36.0" y="96.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">77 died (32.2%)</text><text x="701.0" y="76.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#1C1B18" text-anchor="start" font-weight="600">60 holdout</text><text x="701.0" y="96.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">19 died (31.7%)</text><text x="24.0" y="128.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">Stratified 80/20 split by outcome, random_state 7. The MinMax scaler is fitted on the training rows only,</text><text x="24.0" y="144.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">so holdout values can fall slightly outside 0 to 1; they are clipped before encoding.</text><rect x="24.0" y="158.0" width="408.0" height="98.0" rx="2" fill="#E8E7E2" stroke="#1E6B55" stroke-width="1.5"/><text x="38.0" y="180.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#1E6B55" text-anchor="start" font-weight="600">With follow-up time</text><rect x="38.0" y="192.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="48.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">1  ejection_fraction</text><rect x="228.0" y="192.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="238.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">2  serum_creatinine</text><rect x="38.0" y="222.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="48.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">3  age</text><rect x="228.0" y="222.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="238.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">4  time</text><rect x="448.0" y="158.0" width="408.0" height="98.0" rx="2" fill="#E8E7E2" stroke="#57544C" stroke-width="1.5"/><text x="462.0" y="180.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#57544C" text-anchor="start" font-weight="600">Without time</text><rect x="462.0" y="192.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="472.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">1  ejection_fraction</text><rect x="652.0" y="192.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="662.0" y="209.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">2  serum_creatinine</text><rect x="462.0" y="222.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="472.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">3  age</text><rect x="652.0" y="222.0" width="180.0" height="24.0" rx="2" fill="#DDDBD3" stroke="none" stroke-width="0"/><text x="662.0" y="239.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#1C1B18" text-anchor="start" font-weight="400">4  serum_sodium</text><text x="24.0" y="278.0" font-family="ui-sans-serif, system-ui, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#57544C" text-anchor="start" font-weight="400">Four features because the track allows four qubits. Each feature is one qubit.</text></svg>
